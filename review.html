<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — HELCCO Landscape Construction</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .printc { max-width: 5.05in; margin: 1.1rem auto; background: #f3ead3; color: #1a2416; padding: 1rem; border: 8px solid #2f6b3a; }
    .printc h1 { font-family: "Patua One", Georgia, serif; font-size: 1.35rem; margin: 0 0 0.25rem; }
    .printc img { width: 200px; height: 200px; display: block; margin: 0.6rem auto; background: #fff; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button, .actions a { background: #7a2a14; color: #f3ead3; border: 0; padding: 0.45rem 0.65rem; text-decoration: none; cursor: pointer; font-family: "Anonymous Pro", ui-monospace, monospace; }
    @media print { .lang, .actions { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <article class="printc">
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
    <h1>HELCCO Landscape Construction</h1>
    <p>Vista, CA 92056 · Oceanside, CA · C-27 #764626</p>
    <p>Pedro Hernandez<br>
      <a class="plain" href="tel:+17608225971">760-822-5971</a>
      · <a class="plain" href="sms:+17608225970">760-822-5970</a>
    </p>
    <img src="review-qr.svg" width="200" height="200" alt="QR code to HELCCO Landscape Construction on Yelp">
    <p data-en="Scan to open our Yelp listing and leave a review." data-es="Escanee para abrir nuestra ficha de Yelp y dejar una reseña.">Scan to open our Yelp listing and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the lid" data-es="Volver a la tapa">Back to the lid</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
